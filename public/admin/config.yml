backend:
  name: git-gateway
  repo: ASLGF-chataigneraies/aslgf-chataigneraies
  branch: main

media_folder: "public/img" # Où les images seront stockées
public_folder: "/img" # Comment les images seront appelées dans le Markdown

collections:
  - name: "blog"
    label: "Articles de Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Tags", name: "tags", widget: "list", default: ["nature"], required: false }
      - { label: "Corps de l'article", name: "body", widget: "markdown" }
